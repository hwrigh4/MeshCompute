services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: meshcompute
      POSTGRES_PASSWORD: meshcompute
      POSTGRES_DB: meshcompute
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshcompute -d meshcompute"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
