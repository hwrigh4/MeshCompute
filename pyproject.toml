[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcompute"
version = "0.1.0"
description = "A control plane for preemptible, provider-owned compute"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["controller*", "common*", "worker*", "cli*"]
